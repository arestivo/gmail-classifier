[project]
name = "gmail-classifier"
version = "0.1.0"
description = ""
authors = [
    {name = "André Restivo",email = "arestivo@fe.up.pt"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "google-api-python-client (>=2.200.0,<3.0.0)",
    "google-auth-httplib2 (>=0.4.2,<0.5.0)",
    "google-auth-oauthlib (>=1.4.1,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "typer (>=0.27.2,<0.28.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
gmail-classifier = "gmail_classifier.cli:app"